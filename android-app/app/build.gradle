plugins {
    id "com.android.application"
}

android {
    namespace "com.doctorderescate.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.doctorderescate.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "API_BASE_URL", "\"https://doctor-de-rescate.vercel.app\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
